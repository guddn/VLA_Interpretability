# 실험 기본 설정
#
# 환경변수를 여기서 관리합니다. .bashrc 를 고칠 필요가 없습니다.
# 서버가 바뀌면 이 파일을 복사해서 configs/<이름>.yaml 로 만들고
#   python scripts/01_smoke_forward.py --config configs/<이름>.yaml
# 처럼 쓰세요. 재현 시 "어떤 config 로 돌렸는지"만 기록하면 됩니다.

env:
  # HuggingFace 캐시 루트. null 이면 시스템 기본(~/.cache/huggingface).
  # 모델 파일은 <hf_home>/hub/models--openvla--... 아래에 들어갑니다.
  # !! 다운로드와 로드 **양쪽** 에 쓰입니다. 여기만 바꾸면 둘 다 따라갑니다.
  hf_home: "~/shared/hdd_ext/nvme1/kimhyeongwoo"

  # headless 렌더링 (LIBERO/MuJoCo). 서버면 egl, 로컬 GUI 면 glfw.
  mujoco_gl: "egl"
  pyopengl_platform: "egl"

model:
  # setup/03_download_ckpt.py 의 CKPTS 와 맞춰 쓰세요.
  path: "openvla/openvla-7b-finetuned-libero-spatial"
  dtype: "bfloat16"
  # !! 반드시 eager. flash_attention_2 / sdpa 는 output_attentions 를 무시합니다.
  attn_implementation: "eager"
  device: "cuda:0"
  # LIBERO fine-tuned 체크포인트의 action un-normalization key
  unnorm_key: "libero_spatial"

tokens:
  # 프롬프트 템플릿의 고정 문구를 L(언어 구간)에서 제외할지 여부.
  # True 로 두는 것을 강력히 권장합니다. (계획서 Phase 1 주의 1)
  instruction_only: true
  # BOS / attention sink 후보를 별도 집합 S 로 분리
  separate_sink: true
  # sink 로 취급할 절대 위치 (BOS=0). 실측 후 조정하세요.
  sink_positions: [0]

metrics:
  # 어느 층을 집계할지. null 이면 전체
  layers: null
  # head 별로 저장할지 (용량 커짐). False 면 head 평균만
  per_head: true

intervene:
  # knockout 시 마스킹할 대상
  targets: ["language", "vision"]
  # ISS식 치환에 쓸 baseline: "other_instruction" | "shuffled" | "empty"
  # "empty"(0벡터)는 OOD 라 권장하지 않습니다.
  replacement_baseline: "other_instruction"

run:
  seed: 0
  out_dir: "outputs"
